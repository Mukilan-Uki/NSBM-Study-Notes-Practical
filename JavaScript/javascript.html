<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript | Intergrated in HTML</title>
    <script>
        document.write("This is inside the HEAD")
        alert("This is an ALERT from head")
    </script>
</head>
<body>
    <h1>Practice with JS</h1>
    <script>
        document.write("This is inside the BODY")
    </script>
    <script>
        document.write("This is another script inside the BODY")
        window.alert("This is an ALERT using window.alert")
    </script>
    <script src="test.js"></script>
</body>
</html>
