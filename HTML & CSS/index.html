<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    

</head>
<body>
    <form action="">

        <script src="script.js"></script>

        <h1>Ticket Booking Platform</h1>
        <fieldset>  
            <legend>Booking Details</legend>

            <label for="name">Customer Name:</label>
            <input type="text" name="name" id="name" required><br><br>

            <label for="name">Email Address:</label>
            <input type="email" name="email" id="email required"><br><br>

            <label for="movie">Movie:</label>
            <select name="movie" id="movie">
                <option value="theri">Theri</option>
                <option selected value="Avengers">Avengers</option>
            </select>
                
            <label for="name">Date:</label>
            <input type="date" name="date" id="date"><br><br>

            <label for="name">Number of Tickets:</label>
            <input type="number" name="ticket" id="ticket"><br><br>

            <label for="name">Seat Type</label><br><br>
            <input type="radio" name="seat" id="seat">
            <label for="seat">Regular</label>
            <input type="radio" name="seat" id="seat">
            <label for="seat">Premium</label><br><br>
            
            <label for="snacks">Snacks</label><br>

            <input type="checkbox" name="chips" id="chips">
            <label for="chips">Chips</label>
            <input type="checkbox" name="soda" id="soda">
            <label for="soda">Soda</label>
            <input type="checkbox" name="popcorn" id="popcorn">
            <label for="popcorn">Popcorn</label>

            <br><br>

            <label for="special">Special Requasts:</label><br>
            <textarea name="special" id="special" rows="4" cols="20"></textarea><br><br>
        </fieldset>
        <div class="button">
            <button type="submit" value="submit">Book Tickets</button>
            <button type="reset">Clear Form</button>
        </div>
    </form>

    <script>
        function task2(){
            let name = window.prompt("Your Name?")
            let degree = window.prompt("Degree Program?")

            alert("Welcome, "+name+"Enjoy your BSc (Hons) "+degree+" journey.")

        }
        task2()

        function task3(){
            alert("Welcome to my website!");
        }
        task3()
        function task4(){
            let age = window.prompt("Your Age?")
            let rate = window.prompt("Movie Rating?")
            if (age==18 && rate<18){
                alert("You are not eligible!")
            }
            else if(age==15 && rate<15){
                alert("You are not eligible")
            }
            else{
                alert("You are eligible!")
            }
        }
    </script>
</body>
</html>
