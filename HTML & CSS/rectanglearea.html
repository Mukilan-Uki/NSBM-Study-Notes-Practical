<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Rectangle Area Calculator</title>
</head>
<body>
    <script>
        function Area(){
            let length = window.prompt("Length of the Regtangle?")
            let width = window.prompt("Width of the Rectangle?")

            let area = length * width
            alert("Your Rectangle Area: "+area)
        }
        Area()
    </script>
</body>
</html>
